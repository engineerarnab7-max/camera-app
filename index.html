<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guided Photo Capture</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14171c;--mut:#5d6672;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;--bd:#d9dee5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#181b21;--tx:#eef0f3;--mut:#9aa3af;--ac:#60a5fa;--ok:#4ade80;--bad:#f87171;--bd:#2a2f38}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.slot{border:1px dashed var(--bd);border-radius:10px;padding:6px;text-align:center;font-size:11px;color:var(--mut)}
.slot img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block;margin-bottom:4px;background:var(--bg)}
.slot.done{border:1px solid var(--ok)}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:70vh;margin:0 auto}
video,canvas.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
video{transform:scaleX(-1)}
canvas.ov{transform:scaleX(-1)}
.hud{position:absolute;left:0;right:0;top:0;padding:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:rgba(0,0,0,.65);color:#fff;font-size:13px;padding:6px 10px;border-radius:20px}
.msg{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(0,0,0,.7);color:#fff;border-radius:12px;padding:10px;font-size:14px;text-align:center}
.msg.ok{background:rgba(22,163,74,.9)}
.thumb{position:absolute;right:10px;top:48px;width:84px;border:2px solid #fff;border-radius:8px;overflow:hidden;background:#000}
.thumb img{width:100%;display:block}
.hint{font-size:13px;color:var(--mut);margin:6px 0}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.hidden{display:none}
label.up{display:block;margin-bottom:10px;font-size:13px}
input[type=file]{font-size:12px;width:100%}
.stepname{font-weight:700;font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Guided Photo Capture</h1>
  <div class="sub">Sample dekhe match hole auto capture hobe. Photo gulo tomar device e-i thake.</div>

  <!-- SETUP / LOADING -->
  <div id="setup" class="card">
    <div class="stepname">Camera chalu hocche...</div>
    <div class="hint" id="setupStatus">Ektu opekkha koro. Camera permission chaile Allow dao.</div>
    <div id="uploads" class="hidden"></div>
    <div class="row"><button id="btnAnalyze" class="hidden">Abar chesta koro</button></div>
  </div>

  <!-- CAPTURE -->
  <div id="capture" class="card hidden">
    <div class="stepname" id="stepTitle"></div>
    <div class="hint" id="stepHint"></div>
    <div class="stage" id="stage">
      <video id="vid" playsinline muted autoplay></video>
      <canvas class="ov" id="ov"></canvas>
      <div class="hud"><span class="pill" id="pillStep"></span><span class="pill" id="pillMatch"></span></div>
      <div class="thumb" id="thumbBox"><img id="thumbImg" alt="sample"></div>
      <div class="msg" id="msg">Camera chalu hocche...</div>
    </div>
    <div class="bar"><i id="holdBar"></i></div>
    <div class="row">
      <button class="sec" id="btnSkip">Skip</button>
      <button class="sec" id="btnBack">Ager ta abar</button>
      <button class="sec" id="btnFlip">Camera ulto koro</button>
      <button class="sec" id="btnManual" title="Match na hole nijei capture">Manual capture</button>
    </div>
  </div>

  <!-- GALLERY -->
  <div class="card">
    <div class="stepname">Captured: <span id="count">0</span> / 30</div>
    <div class="grid" id="gallery"></div>
    <div class="row">
      <button id="btnZip" disabled>ZIP download</button>
      <button class="sec" id="btnReset">Sob muche notun kore shuru</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

/* ============ MEDIAPIPE ============ */
async function loadLM(){
  if(landmarker)return landmarker;
  const V=window.vision||window.tasksVision||window;
  const FS=V.FilesetResolver||(window.FilesetResolver);
  const FL=V.FaceLandmarker||(window.FaceLandmarker);
  if(!FS||!FL) throw new Error("MediaPipe load hoy ni. Internet check koro.");
  const fs=await FS.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  const opts=(delegate)=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate},runningMode:"IMAGE",numFaces:1,outputFacialTransformationMatrixes:true});
  try{landmarker=await FL.createFromOptions(fs,opts("GPU"));}
  catch(e){landmarker=await FL.createFromOptions(fs,opts("CPU"));}
  return landmarker;
}

/* signature: yaw/pitch/roll + face center/size + shoulder-space hint */
function signature(res,w,h){
  if(!res.faceLandmarks||!res.faceLandmarks.length) return null;
  const lm=res.faceLandmarks[0];
  let xs=lm.map(p=>p.x),ys=lm.map(p=>p.y);
  const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);
  const cx=(minx+maxx)/2,cy=(miny+maxy)/2,size=maxx-minx;
  let yaw=0,pitch=0,roll=0;
  const m=res.facialTransformationMatrixes&&res.facialTransformationMatrixes[0];
  if(m){
    const d=m.data; // column-major 4x4
    const r00=d[0],r10=d[1],r20=d[2],r21=d[6],r22=d[10];
    pitch=Math.atan2(-r21,r22)*180/Math.PI; // sign normalised below
    yaw=Math.asin(Math.max(-1,Math.min(1,r20)))*180/Math.PI;
    roll=Math.atan2(r10,r00)*180/Math.PI;
    // normalise pitch to [-90,90]
    if(pitch>90)pitch-=180; if(pitch<-90)pitch+=180;
  }
  const dd=(a,b)=>Math.hypot(lm[a].x-lm[b].x,lm[a].y-lm[b].y);
  const fw=dd(234,454);
  return {yaw,pitch,roll,cx,cy,size,bottom:maxy,lm,mouthW:dd(61,291)/fw,mouthOpen:dd(13,14)/fw};
}

/* Eyes + eyebrows + shoulder-space checks (for pose & historical) */
function visibilityOK(sig){
  const lm=sig.lm;
  // eyes: 33,133,362,263 ; brows: 70,105,300,334 ; all must lie inside frame
  const ids=[33,133,362,263,70,105,300,334,10,152];
  for(const i of ids){const p=lm[i];if(p.x<0.02||p.x>0.98||p.y<0.02||p.y>0.98)return "Mukh frame er bairey";}
  // shoulder room: chin must be above ~72% of height so shoulders fit below
  if(sig.bottom>0.74)return "Aro pichone jao, shoulder frame e ashe nai";
  if(sig.size>0.52)return "Camera theke aro dure jao";
  if(sig.size<0.14)return "Camera r kache aso";
  if(sig.cy<0.18)return "Mukh ektu nichu koro";
  return null;
}

/* ============ ANALYZE SAMPLES ============ */
async function begin(){
  const st=$('setupStatus');st.textContent="Model load hocche (prothombar ektu somoy lagte pare)...";
  $('btnAnalyze').classList.add('hidden');
  try{
    const lmk=await loadLM();
    for(const s of STEPS.filter(s=>s.type==='sample')){
      const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=samples[s.key].url;});
      const res=lmk.detect(img);
      samples[s.key].sig=signature(res,img.width,img.height); // null hole ei step e auto-match hobe na
    }
    await lmk.setOptions({runningMode:"VIDEO"});
    $('setup').classList.add('hidden');$('capture').classList.remove('hidden');
    idx=firstPending();await startCam();gotoStep(idx);
  }catch(e){
    st.textContent="Error: "+e.message;
    $('btnAnalyze').classList.remove('hidden');
  }
}
$('btnAnalyze').onclick=begin;

/* ============ CAMERA ============ */
async function startCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:1706}},audio:false});
    const v=$('vid');v.srcObject=stream;await v.play();
    v.style.transform=facing==='user'?'scaleX(-1)':'none';
    $('ov').style.transform=v.style.transform;
  }catch(e){setMsg("Camera permission dao: "+e.message,false);}
}
$('btnFlip').onclick=async()=>{facing=facing==='user'?'environment':'user';await startCam();};

function firstPending(){const i=STEPS.findIndex(s=>!shots[s.key]);return i<0?STEPS.length:i;}
function setMsg(t,ok){const m=$('msg');m.textContent=t;m.className='msg'+(ok?' ok':'');}

function gotoStep(i){
  idx=Math.max(0,i);
  if(idx>=STEPS.length){
    cancelAnimationFrame(raf);
    $('stepTitle').textContent="Sob shesh!";$('stepHint').textContent="ZIP download koro.";
    setMsg("Sob photo capture hoyeche",true);$('thumbBox').classList.add('hidden');return;
  }
  const s=STEPS[idx];
  $('stepTitle').textContent=`${idx+1}/${STEPS.length}: ${s.label}`;
  $('stepHint').textContent=s.note;
  $('pillStep').textContent=s.key;
  const sm=samples[s.key];
  if(sm){$('thumbImg').src=sm.url;$('thumbBox').classList.remove('hidden');}else $('thumbBox').classList.add('hidden');
  holdStart=0;$('holdBar').style.width='0';
  cancelAnimationFrame(raf);loop();
}
$('btnSkip').onclick=()=>gotoStep(idx+1);
$('btnBack').onclick=()=>gotoStep(idx-1);
$('btnManual').onclick=()=>{
  if(idx>=STEPS.length)return;
  if(!confirm("Manual capture e sample match check hobe na. Continue?"))return;
  doCapture();
};

/* ============ MATCH LOOP ============ */
let lastTs=-1;
function loop(){
  raf=requestAnimationFrame(loop);
  const v=$('vid');
  if(!landmarker||v.readyState<2||busy||idx>=STEPS.length)return;
  const ts=performance.now();if(ts===lastTs)return;lastTs=ts;
  let res;try{res=landmarker.detectForVideo(v,ts);}catch(e){return;}
  const sig=signature(res,v.videoWidth,v.videoHeight);
  const s=STEPS[idx];
  const T=s.key.startsWith('pose_')?TOLP:TOL;
  const ov=$('ov');ov.width=v.videoWidth;ov.height=v.videoHeight;
  const c=ov.getContext('2d');c.clearRect(0,0,ov.width,ov.height);

  if(!sig){fail("Mukh dekha jacche na");return;}
  const vis=visibilityOK(sig);

  let problems=[];
  if(vis)problems.push(vis);

  if(s.type==='sample'){
    const t=samples[s.key].sig;
    if(!t){fail("Ei sample theke auto-match hocche na. Sample moto pose kore 'Manual capture' chapo");return;}
    const dy=sig.yaw-t.yaw, dp=sig.pitch-t.pitch, dr=sig.roll-t.roll;
    // NOTE: mirrored preview: user-friendly directions computed on raw yaw
    if(Math.abs(dy)>T.yaw)problems.push(dy>0?"Aro bamdike ghurao":"Aro dandike ghurao");
    if(Math.abs(dp)>T.pitch)problems.push(dp>0?"Mukh ektu nichu koro":"Mukh ektu upore tolo");
    if(Math.abs(dr)>T.roll)problems.push("Matha shoja rakho (tilt)");
    if(Math.abs(sig.cx-t.cx)>T.cx)problems.push(sig.cx>t.cx?"Ektu bamdike sorо":"Ektu dandike soro");
    if(Math.abs(sig.cy-t.cy)>T.cy)problems.push(sig.cy>t.cy?"Ektu upore soro":"Ektu nichu soro");
    if(Math.abs(sig.size/t.size-1)>T.size)problems.push(sig.size>t.size?"Camera theke ektu dure jao":"Camera r ektu kache aso");
    // expression: sample er moto (hasi/mukh khola) match korte hobe
    if(s.key.startsWith('selfie_')){
      if(sig.mouthW-t.mouthW>0.04)problems.push("Hasi ektu komao");
      else if(t.mouthW-sig.mouthW>0.04)problems.push("Ektu hasi dao (sample er moto)");
      if(sig.mouthOpen-t.mouthOpen>0.02)problems.push("Mukh bondho rakho");
    }
  }else{
    // historical: slight tilt limit only
    if(Math.abs(sig.yaw)>35||Math.abs(sig.pitch)>30)problems.push("Mukh ektu camera r dike ghurao");
  }

  drawBox(c,sig,problems.length===0,ov);
  if(problems.length){fail(problems[0]);return;}

  // all good → hold
  if(!holdStart)holdStart=performance.now();
  const p=Math.min(1,(performance.now()-holdStart)/HOLD_MS);
  $('holdBar').style.width=(p*100)+'%';
  $('pillMatch').textContent="Match ✓";
  setMsg("Thik ache! Ei bhabe thako...",true);
  if(p>=1)doCapture();
}
function fail(t){holdStart=0;$('holdBar').style.width='0';$('pillMatch').textContent="Match hoyni";setMsg(t,false);}

function drawBox(c,sig,ok,ov){
  const W=ov.width,H=ov.height;
  c.lineWidth=3;c.strokeStyle=ok?'#4ade80':'#f87171';
  const w=sig.size*W,h=w*1.3;
  c.strokeRect(sig.cx*W-w/2,sig.cy*H-h/2,w,h);
}

/* Smile check using blendshape-free geometry: mouth width / face width and mouth opening */
function exprCheck(res,key){
  const lm=res.faceLandmarks[0];
  const d=(a,b)=>Math.hypot(lm[a].x-lm[b].x,lm[a].y-lm[b].y);
  const face=d(234,454);
  const mouthW=d(61,291)/face;
  const open=d(13,14)/face;
  if(key==='selfie_1'){ if(mouthW>0.40)return "Hasi komao, gombhir hou"; }
  if(key==='selfie_2'){ if(mouthW<0.38)return "Ektu halka hasi dao"; if(mouthW>0.50)return "Hasi ektu komao"; if(open>0.035)return "Dat dekha jacche, mukh bondho rakho"; }
  if(key==='selfie_3'){ if(mouthW<0.46)return "Ektu beshi hasi dao"; if(open>0.045)return "Dat dekha jacche, mukh bondho rakho"; }
  return null;
}

/* ============ CAPTURE ============ */
function doCapture(){
  if(busy)return;busy=true;
  const v=$('vid'),c=document.createElement('canvas');
  c.width=v.videoWidth;c.height=v.videoHeight;
  const g=c.getContext('2d');
  if(facing==='user'){g.translate(c.width,0);g.scale(-1,1);} // save un-mirrored? keep natural orientation
  // save as real (non-mirrored) photo: undo mirror so text/orientation is natural
  g.setTransform(1,0,0,1,0,0);
  if(facing==='user'){g.translate(c.width,0);g.scale(-1,1);}
  g.drawImage(v,0,0);
  const key=STEPS[idx].key;
  c.toBlob(b=>{
    if(shots[key])URL.revokeObjectURL(shots[key].url);
    shots[key]={blob:b,url:URL.createObjectURL(b)};
    flash();renderGallery();
    holdStart=0;$('holdBar').style.width='0';
    setTimeout(()=>{busy=false;gotoStep(firstPendingAfter(idx));},700);
  },'image/jpeg',0.93);
}
function firstPendingAfter(i){for(let k=i+1;k<STEPS.length;k++)if(!shots[STEPS[k].key])return k;return STEPS.length;}
function flash(){const st=$('stage');st.style.filter='brightness(2)';setTimeout(()=>st.style.filter='',120);}

/* ============ GALLERY / ZIP ============ */
function renderGallery(){
  const g=$('gallery');g.innerHTML='';
  STEPS.forEach((s,i)=>{
    const d=document.createElement('div');d.className='slot'+(shots[s.key]?' done':'');
    d.innerHTML=(shots[s.key]?`<img src="${shots[s.key].url}" alt="${s.key}">`:`<div style="aspect-ratio:3/4"></div>`)+s.key;
    d.style.cursor='pointer';d.onclick=()=>{if($('capture').classList.contains('hidden'))return;busy=false;gotoStep(i);window.scrollTo({top:0,behavior:'smooth'});};
    g.appendChild(d);
  });
  const n=Object.keys(shots).length;$('count').textContent=n;$('btnZip').disabled=n===0;
}
$('btnZip').onclick=async()=>{
  const z=new JSZip();
  Object.entries(shots).forEach(([k,v])=>z.file(k+".jpg",v.blob));
  const b=await z.generateAsync({type:'blob'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download="participant_photos.zip";a.click();
};
$('btnReset').onclick=()=>{
  if(!confirm("Sob photo muche jabe. Nischit?"))return;
  Object.values(shots).forEach(s=>URL.revokeObjectURL(s.url));
  for(const k in shots)delete shots[k];
  renderGallery();if(!$('capture').classList.contains('hidden'))gotoStep(0);
};
renderGallery();
begin();
</script>
